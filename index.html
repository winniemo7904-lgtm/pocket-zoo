function openProfile(edit){editProfile=!!edit;avatarSelected=s.profile?.avatar||'capy';q('zooInput').value=s.profile?.name||'口袋動物園';q('keeperInput').value=s.profile?.keeper||'';var g=s.profile?.gender||'none';root.querySelectorAll('[name=keeperGender]').forEach(function(i){i.checked=i.value===g});q('introStart').textContent=edit?'儲存園長資料':'🐾 確認資料，開始經營';q('introErr').textContent='';drawAvatars();q('intro').classList.remove('hidden')}
function closeProfile(){q('intro').classList.add('hidden')}

var index=function(id){return A.findIndex(function(a){return a.id===id})};var animal=function(id){return A[index(id)]};var nAnimals=function(){return Object.keys(s.animals).length};var fmt=function(n){return Math.round(n).toLocaleString('zh-TW')};var time=function(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};var revealedOrder=[4,1,3,5,7,0,2,6,8];
function pc(a){return a.req?Math.min(9,s.pieces[a.id]||0):s.animals[a.id]?9:0}
function mosaic(a){var n=pc(a),str='<div class="mosaic">';for(var i=0;i<9;i++){var yes=revealedOrder.slice(0,n).indexOf(i)!==-1;var x=(i%3)*50,y=Math.floor(i/3)*50;str+='<div class="tile '+(yes?'revealed':'')+'">'+(yes?'<div class="part" style="background-image:url('+a.img+');background-position:'+x+'% '+y+'%"></div>':'?')+'</div>'}return str+'</div>'}
function header(){q('zooNameLabel').textContent=s.profile?.name||'口袋動物園';q('ownerLabel').textContent=s.profile?(selectedAvatar()+' 園長：'+s.profile.keeper):'🌱 先建立園長資料';q('di').textContent='第 '+s.day+' 天';q('ti').textContent=time(s.min);q('phase').textContent={ready:'待開園',running:'營業中',paused:'已暫停',closed:'已閉園'}[s.mode];q('money').textContent=fmt(s.coins);q('visitors').textContent=fmt(s.visitors);q('owned').textContent=nAnimals()+'/7';q('open').textContent={ready:'🌅 09:00 手動開園',running:'⏸ 暫停營業',paused:'▶ 繼續營業',closed:'🌅 手動開啟第 '+(s.day+1)+' 天'}[s.mode];root.querySelectorAll('[data-speed]').forEach(function(b){b.classList.toggle('active',+b.dataset.speed===s.speed)});root.querySelectorAll('[data-go]').forEach(function(b){b.classList.toggle('active',b.dataset.go===s.tab)})}
function zoo(){return '<div class="tip">🌿 '+s.msg+' 拖動園區列表，點擊棲地可以開啟建造。</div><div class="map"><div class="entrance">🐾 動物園入口 🎟️ '+(s.mode==='running'?'遊客入園中':'準備營業')+'</div><div class="land">'+A.map(function(a){var own=!!s.animals[a.id];return '<button data-buyview="'+a.id+'" class="hab '+(a.hab==='沙地'?'sand':a.hab==='溪流'?'river':'')+' '+(!own?'empty':'')+'"><img src="'+a.img+'" alt=""><strong>'+(own?a.name:'＋ '+a.name)+'</strong></button>'}).join('')+'</div><div class="shop">'+(s.stall?'🌭🥤 美食小站已營業':'🌭🥤 美食小站（尚未建造）')+'</div></div>'}
function build(){return '<h3>🔨 建造棲地</h3><div class="tip">初始 5 種動物直接用金幣購買；企鵝和長頸鹿需先拼完整。</div><div class="cards">'+A.map(function(a){var owned=!!s.animals[a.id],locked=!!a.req&&pc(a)<a.req;return '<div class="card"><img src="'+a.img+'" alt="'+a.name+'"><b>'+a.name+'</b><small>'+a.hab+(a.req?' · 拼圖 '+pc(a)+'/9':' · 初始開放')+'</small><button data-buy="'+a.id+'" '+(locked?'disabled':'')+'>'+(owned?'🥕 餵食 30':locked?'🔒 尚未拼完':'🪙 '+a.cost+' 建造')+'</button></div>'}).join('')+'<div class="card"><b>🌭🥤 小吃攤</b><small>遊客自動購買熱狗、汽水</small><button data-buy="stall" '+(s.stall?'disabled':'')+'>'+(s.stall?'✓ 已建造':'🪙 500 建造')+'</button></div></div>'}
function puzzle(){var a=animal(s.target),n=pc(a);return '<h3>🧩 動物拼圖</h3><div class="tip">每找到一片，就會露出動物身體的一部分。圖鑑左頁也會同步更新。</div><div class="chooser">'+A.filter(function(a){return a.req}).map(function(a){return '<button data-target="'+a.id+'" class="'+(a.id===s.target?'active':'')+'">'+a.name+' '+pc(a)+'/9</button>'}).join('')+'</div><div class="large-mosaic">'+mosaic(a)+'</div><div class="fraction">'+a.name+' 拼圖 '+n+'/9</div><div class="bar"><div style="width:'+(n/9*100)+'%"></div></div><div class="actions"><button data-collect="1">🌿 今日探索 +1</button><button data-collect="3">🎁 試玩 +3 片</button><button data-view="'+a.id+'">📖 看左頁拼圖</button></div><div class="tip">'+(n===9?'🎉 拼圖完成，現在可以用金幣建造！':s.msg)+'</div>'}
function book(){var a=A[s.book],n=pc(a),owned=!!s.animals[a.id];return '<h3>📖 動物百科圖鑑</h3><div class="chooser"><button data-book="penguin">🐧 企鵝</button><button data-book="giraffe">🦒 長頸鹿</button></div><div class="book"><div class="heading">'+a.name+' · '+(s.book+1)+'/7</div><div class="spread"><div>'+mosaic(a)+'<div class="fraction">'+(a.req?'拼圖 '+n+'/9':owned?'✓ 已收藏':'尚未購買')+'</div></div><div><p><b>'+(owned?a.name:n===9?'拼圖已完成':'尚未入住')+'</b></p>'+(owned?'<p><i>'+a.latin+'</i></p><p>棲地：'+a.hab+'<br>食物：'+a.food+'</p><p>'+a.bio+'</p>':'<p>'+(a.req?'已找到 '+n+'/9 片；左側會逐塊拼出完整身體。':'使用金幣建造棲地後，可閱讀完整動物百科。')+'</p>')+'</div></div><div class="bar"><div style="width:'+(n/9*100)+'%"></div></div><div class="page-turn"><button data-flip="-1">❮ 上一頁</button><button data-flip="1">下一頁 ❯</button></div></div><div class="tip">'+(n===9?'✅ 動物已完整顯示。': '💡 收集的每片拼圖，都會對應左頁的一個身體區塊。')+'</div>'}
function settings(){return '<h3>⚙️ 個人資料與聲音設定</h3><div class="profilebox"><b>'+selectedAvatar()+' '+encode(s.profile?.keeper||'園長')+'</b><div>'+encode(s.profile?.name||'口袋動物園')+'</div><button class="editprofile" data-editprofile="1">✏️ 修改園長資料</button></div><div class="setting"><div><b>🎵 背景音樂</b><small>原創輕柔循環旋律</small></div><button class="'+(s.music?'on':'')+'" data-audio="music">'+(s.music?'開啟 ✓':'關閉')+'</button></div><div class="setting"><div><b>🔔 操作音效</b><small>點擊、翻頁、領取拼圖</small></div><button class="'+(s.fx?'on':'')+'" data-audio="fx">'+(s.fx?'開啟 ✓':'關閉')+'</button></div><div class="actions"><button data-audio="test">🔊 試聽音效</button><button data-back="1">返回遊戲</button></div><div class="tip">需手動開啟聲音。手機靜音模式及瀏覽器限制可能影響播放。</div>'}
function render(reset){header();q('stage').innerHTML=s.tab==='zoo'?zoo():s.tab==='build'?build():s.tab==='puzzle'?puzzle():s.tab==='book'?book():settings();if(reset)q('stage').scrollTop=0}
var ac=null,musicTimer=null,musicN=0;
function audio(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!ac)ac=new C();if(ac.state==='suspended')ac.resume().catch(function(){});return ac}catch(e){return null}}
function tone(hz,volume){var a=audio();if(!a)return;try{var osc=a.createOscillator(),gain=a.createGain(),t=a.currentTime;osc.frequency.value=hz;osc.type='sine';gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(volume||.018,t+.02);gain.gain.exponentialRampToValueAtTime(.0001,t+.22);osc.connect(gain);gain.connect(a.destination);osc.start(t);osc.stop(t+.25)}catch(e){}}
function fx(){if(s.fx)tone(690,.028)}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function startMusic(){stopMusic();if(!s.music||document.hidden)return;var notes=[392,440,523,440,349,392,329,349,392,523,440,392];tone(notes[musicN++%notes.length],.015);musicTimer=setInterval(function(){if(s.music&&!document.hidden)tone(notes[musicN++%notes.length],.015)},460)}
function buy(id){if(id==='stall'){if(s.stall)return;if(s.coins<500){s.msg='金幣不足，還不能建造小吃攤。';render();return}s.stall=true;s.coins-=500;s.msg='🌭 小吃攤已開張！';fx();render();return}var a=animal(id);if(!a)return;if(a.req&&pc(a)<9)return;if(s.animals[id]){if(s.coins<30){s.msg='金幣不足，不能餵食。';render();return}s.coins-=30;s.animals[id].mood=Math.min(100,s.animals[id].mood+20);s.msg='💚 已餵食 '+a.name;fx();render();return}if(s.coins<a.cost){s.msg='金幣不足，先開園賺錢吧。';render();return}s.coins-=a.cost;s.animals[id]={mood:80};s.msg='🎉 '+a.name+'入住！圖鑑資料已更新。';fx();render()}
root.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||!root.contains(b))return;var d=b.dataset;
if(d.editprofile){openProfile(true);return}
if(d.speed){s.speed=Number(d.speed);fx();render();return}
if(d.go){if(d.go==='settings'){s.before=s.tab;s.tab='settings'}else s.tab=d.go;fx();render(true);return}
if(d.back){s.tab=s.before;render(true);return}
if(d.buyview){s.tab='build';s.msg='🔨 請在建造清單選擇 '+animal(d.buyview).name+'。';render(true);return}
if(d.buy){buy(d.buy);return}
if(d.target){s.target=d.target;fx();render();return}
if(d.collect){var a=animal(s.target);if(d.collect==='1'&&s.explored===s.day){s.msg='今天已經探索過，下一個遊戲日再來。';render();return}if(d.collect==='1')s.explored=s.day;s.pieces[a.id]=Math.min(9,(s.pieces[a.id]||0)+Number(d.collect));s.msg='🧩 獲得 '+a.name+' 的拼圖，左頁增加了身體區塊！';fx();render();return}
if(d.view){s.book=index(d.view);s.tab='book';fx();render(true);return}
if(d.book){s.book=index(d.book);fx();render();return}
if(d.flip){s.book=Math.max(0,Math.min(A.length-1,s.book+Number(d.flip)));fx();render();return}
if(d.audio){if(d.audio==='music'){s.music=!s.music;s.music?startMusic():stopMusic()}else if(d.audio==='fx'){s.fx=!s.fx;if(s.fx)fx()}else tone(720,.035);render();return}
if(d.open){if(s.mode==='ready'){s.mode='running';s.msg='🌅 園區已開園，遊客會自動入園。'}else if(s.mode==='running'){s.mode='paused';s.msg='⏸ 已暫停。'}else if(s.mode==='paused'){s.mode='running';s.msg='▶ 繼續營業。'}else{s.day++;s.min=540;s.mode='running';s.visitors=0;s.acc=0;s.msg='🌅 第 '+s.day+' 天手動開園！'}fx();render();return}
});
root.addEventListener('click',function(ev){var b=ev.target.closest('button');if(b&&root.contains(b)){persist()}});
q('avatars').addEventListener('click',function(e){var b=e.target.closest('[data-avatar]');if(!b)return;avatarSelected=b.dataset.avatar;drawAvatars()});
q('introStart').addEventListener('click',function(){var name=q('zooInput').value.trim(),keeper=q('keeperInput').value.trim();if(!name||!keeper){q('introErr').textContent='請填寫動物園名稱及園長姓名。';return}if(name.length>18||keeper.length>12){q('introErr').textContent='名稱字數超過限制。';return}
var choice=root.querySelector('[name=keeperGender]:checked');s.profile={name:name,keeper:keeper,gender:choice?choice.value:'none',avatar:avatarSelected};persist();closeProfile();s.msg=editProfile?'🌿 園長資料已更新！':'🌿 歡迎 '+keeper+' 園長！從建造第一個棲地開始吧。';render(true);persist()});
function tick(){if(s.mode!=='running')return;var n=nAnimals(),hour=Math.floor(s.min/60),guest=n?Math.max(1,Math.round((2+n*1.5)*(hour>=11&&hour<=16?1.3:.8))):0;s.visitors+=guest;s.coins+=guest*25+(s.stall?Math.round(guest*.4)*29:0);s.min+=10;if(s.min>=1260){s.min=1260;s.mode='closed';s.acc=0;s.coins-=50+n*45+(s.stall?80:0);s.pieces[s.target]=Math.min(9,(s.pieces[s.target]||0)+2);s.msg='🌙 21:00 已自動閉園，獲得 '+animal(s.target).name+' 拼圖 2 片，明天請手動開園。'}render();persist()}
setInterval(function(){var now=Date.now(),dt=Math.max(0,Math.min(300,now-s.last));s.last=now;if(document.hidden||s.mode!=='running')return;s.acc+=dt*s.speed;while(s.acc>=20000&&s.mode==='running'){s.acc-=20000;tick()}},180);
document.addEventListener('visibilitychange',function(){s.last=Date.now();if(document.hidden){if(s.mode==='running')s.mode='paused';stopMusic();persist();render()}else if(s.music)startMusic()});window.addEventListener('pagehide',persist);
render(true);if(!s.profile)openProfile(false);else closeProfile();
})();
</script>
</body></html>
