function mosaic(a){const n=puzzles(a);let r='<div class="mosaic">';for(let i=0;i<9;i++){const show=revealOrder.slice(0,n).includes(i);r+='<div class="tile '+(show?'ok':'')+'">'+(show?'<div class="part" style="background-image:url('+a.img+');background-position:'+(i%3)*50+'% '+Math.floor(i/3)*50+'%"></div>':'?')+'</div>'}return r+'</div>'}
function notify(message){s.msg=message;const el=$('toast');el.textContent=message;el.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2900)}
function updateHeader(){const profile=s.profile;const av=AV.find(a=>a[0]===profile?.avatar);$('brandName').textContent=profile?.name||'口袋動物園';$('owner').textContent=profile?(av?.[1]||'🐾')+' 園長：'+profile.keeper:'🌱 歡迎新任園長';$('day').textContent='第 '+s.day+' 天';$('time').textContent=time(s.min);$('mode').textContent=({ready:'待開園',running:'營業中',paused:'已暫停',closed:'已閉園'})[s.mode];$('coins').textContent=fmt(s.coins);$('guests').textContent=fmt(s.visitors);$('animals').textContent=speciesCount()+' / 7';const btn=$('operation');btn.textContent=({ready:'🌅 開始第 '+s.day+' 天營業',running:'⏸ 暫停營業',paused:'▶ 繼續營業',closed:'🌅 開始第 '+(s.day+1)+' 天營業'})[s.mode];btn.classList.toggle('pause',s.mode==='running');btn.disabled=false;
root.querySelectorAll('[data-speed]').forEach(b=>b.classList.toggle('active',Number(b.dataset.speed)===s.speed));root.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===s.tab));}

function hungerCard(a){const h=Math.round(s.animals[a.id]?.hunger||0);return '<div class="hungerline" data-hungry="'+a.id+'">🍽️ 飢餓度 '+h+'/100</div><div class="hungerbar"><div data-hbar="'+a.id+'" style="width:'+h+'%"></div></div><small>越高代表越餓 · 餵食可降低</small>'}
function buildPage(){return '<h2>🔨 建造與照顧動物</h2><div class="tip">初始五種動物可直接購買。已入住動物可餵食：食物會飛向動物，飢餓度即時下降。</div><div class="cards">'+A.map(a=>{const own=!!s.animals[a.id],locked=a.req&&puzzles(a)<9;return '<div class="card" data-card="'+a.id+'"><img src="'+a.img+'" alt="'+a.name+'像素圖"><b>'+a.name+'</b><small>'+a.hab+' · '+(a.req?'拼圖 '+puzzles(a)+'/9':'初始動物')+'</small>'+(own?hungerCard(a):'<small>'+(locked?'🔒 尚未收集完成':'🪙 棲地 + 首隻動物')+'</small>')+'<button class="btn" data-buy="'+a.id+'" '+(locked?'disabled':'')+'>'+(own?a.feed+' 餵食 30 元':locked?'🧩 尚未解鎖':'🪙 '+fmt(a.cost)+' 建造')+'</button></div>'}).join('')+'<div class="card"><div style="font-size:32px">🌭🥤</div><b>熱狗汽水攤</b><small>營業時帶來餐飲收入，並提升遊客滿意度。</small><button class="btn" data-buy="stall" '+(s.stall?'disabled':'')+'>'+(s.stall?'✓ 已建造':'🪙 500 建造')+'</button></div></div>'}
const dailyTasks=[{id:'visitors',name:'接待 60 位遊客',need:60,measure:()=>s.visitors,reward:130},{id:'feeding',name:'餵食動物 2 次',need:2,measure:()=>s.feedToday,reward:110},{id:'income',name:'今日收入達 500 金幣',need:500,measure:()=>s.earnToday,reward:150}];
function tasksPage(){return '<h2>📋 第 '+s.day+' 天經營任務</h2><div class="tip">完成任務後手動領取獎勵，每項獲得金幣與 1 片指定研究動物拼圖。隔天重置。</div>'+(s.report&&s.report.day===s.day?'<div class="report"><strong>🌙 第 '+s.report.day+' 天閉園結算</strong><div class="score">滿意度 '+s.report.score+' / 100</div><p>今日遊客 '+fmt(s.report.guests)+' 人 · 今日收入 '+fmt(s.report.income)+' 金幣</p><p>支出 '+fmt(s.report.cost)+' 金幣 · 閉園獎勵 '+fmt(s.report.rewardCoins)+' 金幣、'+s.report.rewardPieces+' 片拼圖</p><small>滿意度達 80 分獲得額外拼圖，無須再按領取。</small></div>':'')+dailyTasks.map(t=>{const done=s.tasksClaimed.includes(s.day+':'+t.id),n=Math.min(t.need,t.measure()),ready=n>=t.need;return '<div class="claim '+(done?'done':'')+'"><b>'+t.name+'</b><span class="muted" style="float:right">'+n+' / '+t.need+'</span><div class="meter"><div style="width:'+(n/t.need*100)+'%"></div></div><p>獎勵：🪙 '+t.reward+' ＋ 🧩 1 片研究拼圖</p><button class="btn" data-claim-task="'+t.id+'" '+(!ready||done?'disabled':'')+'>'+(done?'✓ 已領取':ready?'🎁 領取獎勵':'尚未完成')+'</button></div>'}).join('')+'<div class="tip">🍀 每天 21:00 會自動結算滿意度。動物飢餓、遊客、餐飲與員工照護會影響分數。</div>'}
function puzzlePage(){const a=animal(s.target),n=puzzles(a);return '<h2>🧩 動物身體拼圖</h2><div class="tip">找到一片，就只露出動物身體對應的一格；集滿 9 片才顯示完整像素動物。</div><div class="choice">'+A.filter(a=>a.req).map(a=>'<button data-target="'+a.id+'" class="'+(s.target===a.id?'active':'')+'">'+a.name+' '+puzzles(a)+'/9</button>').join('')+'</div><div style="max-width:235px;margin:14px auto">'+mosaic(a)+'</div><div class="progress"><span>'+a.name+'</span><span>🧩 '+n+' / 9</span></div><div class="meter"><div style="width:'+(n/9*100)+'%"></div></div><div class="actions"><button class="btn" data-explore="1" '+(s.explored===s.day?'disabled':'')+'>🌿 每日探索 +1 片</button><button class="btn alt" data-nav="manage">🔬 研究中心</button><button class="btn" data-view="'+a.id+'">📖 查看圖鑑左頁</button></div><div class="tip">研究目標：'+a.name+'；園區任務、保育研究、成就及閉園獎勵都能增加拼圖。</div>'}
function bookPage(){const a=A[s.book],n=puzzles(a),own=!!s.animals[a.id];return '<h2>📖 動物百科圖鑑</h2><div class="book"><div class="bookhead">'+a.name+' · 第 '+(s.book+1)+' / 7 頁</div><div class="spread"><div>'+mosaic(a)+'<div style="text-align:center;font-weight:850;font-size:11px;margin-top:6px">'+(a.req?'拼圖 '+n+'/9':own?'✓ 已收藏':'尚未購買')+'</div></div><div><p><b>'+a.name+'</b></p><p><i>'+a.latin+'</i></p>'+(own?'<p>棲地：'+a.hab+'</p><p>食物：'+a.food+'</p><p>'+a.bio+'</p>':'<p>尚未正式入住動物園。</p>'+(a.req?'<p>目前找到 '+n+' 片拼圖，左頁只會顯示已找到的身體部分。</p>':'<p>請先到建造頁用金幣購買棲地。</p>'))+'</div></div><div class="actions"><button class="btn alt" data-flip="-1" '+(s.book===0?'disabled':'')+'>❮ 上一頁</button><button class="btn alt" data-flip="1" '+(s.book===A.length-1?'disabled':'')+'>下一頁 ❯</button></div></div>'}

{id:'puzzle9',name:'生態研究新星',check:()=>A.some(a=>a.req&&puzzles(a)===9),reward:280,pieces:2,desc:'完成一本動物拼圖'}
];
function managePage(){const r=s.research,m=s.marketing,used=r.lastDay===s.day,choice=animal(s.target);return '<h2>🏛️ 園區管理中心</h2><div class="panel"><div class="panel-title">🔬 動物保育研究中心 '+(r.built?'✓ 已建造':'')+'</div>'+(r.built?'<p>指定研究目標：<b>'+choice.name+'</b>，每日最多考察一次。</p><div class="choice">'+A.filter(a=>a.req).map(a=>'<button class="'+(s.target===a.id?'active':'')+'" data-target="'+a.id+'">'+a.name+'</button>').join('')+'</div><button class="btn wide" data-research="1" '+(used?'disabled':'')+'>'+(used?'✓ 今日已考察':'🔬 研究考察 90 金幣 → '+(speciesCount()>=3?2:1)+' 片')+'</button>':'<p>建造後可指定企鵝或長頸鹿，每個營業日研究一次。</p><button class="btn" data-buy="research">🪙 650 建造研究中心</button>')+'</div>'+
'<div class="panel"><div class="panel-title">📣 行銷活動</div><p>行銷活動能增加當天入園的遊客與收益，每天只能選一種。</p><p>本日活動：<b>'+(m.day===s.day?({'flyer':'街頭傳單（遊客 +50%）','social':'社群宣傳（遊客 +100%）'}[m.type]||'無'):'無')+'</b></p><div class="actions"><button class="btn" data-market="flyer" '+(m.day===s.day||s.mode==='closed'?'disabled':'')+'>📄 傳單 120 金幣</button><button class="btn alt" data-market="social" '+(m.day===s.day||s.mode==='closed'?'disabled':'')+'>📱 社群 240 金幣</button></div></div>'+
'<div class="panel"><div class="panel-title">👕 員工換裝</div><p class="muted">選擇制服後，園區平面圖內的員工會立即換裝。</p>'+roles.map(role=>'<div class="settingsrow"><label for="staff_'+role[0]+'"><b>'+role[2]+' '+role[1]+'</b></label><select id="staff_'+role[0]+'" data-staff="'+role[0]+'" style="min-height:44px;max-width:60%;background:#fff7dc;border:2px solid #b99a6a;border-radius:8px;color:#3d301d">'+Object.entries(outfits).map(([k,v])=>'<option value="'+k+'" '+(s.staff[role[0]]===k?'selected':'')+'>'+v[0]+'</option>').join('')+'</select></div>').join('')+'</div>'+
'<div class="panel"><div class="panel-title">🏆 園區成就</div>'+achDefs.map(a=>{const done=s.achievementsClaimed.includes(a.id),ok=a.check();return '<div class="claim '+(done?'done':'')+'"><b>'+a.name+'</b><p>'+a.desc+' · 獎勵 🪙'+a.reward+' / 🧩'+a.pieces+'片</p><button class="btn" data-achieve="'+a.id+'" '+(!ok||done?'disabled':'')+'>'+(done?'✓ 已領取':ok?'🎁 領取':'尚未達成')+'</button></div>'}).join('')+'</div>'}
function settingsPage(){return '<h2>⚙️ 設定與園長資料</h2><div class="panel"><b>'+(AV.find(a=>a[0]===s.profile?.avatar)?.[1]||'🐾')+' '+escapeHtml(s.profile?.keeper||'園長')+'</b><p>'+escapeHtml(s.profile?.name||'口袋動物園')+'</p><button class="btn" data-edit="1">✏️ 修改園長資料</button></div><div class="settingsrow"><div><b>🎵 背景音樂</b><div class="muted">原創合成短旋律</div></div><button class="btn" data-sound="music">'+(s.music?'開啟 ✓':'關閉')+'</button></div><div class="settingsrow"><div><b>🔔 操作音效</b><div class="muted">建造、餵食與翻頁</div></div><button class="btn" data-sound="fx">'+(s.fx?'開啟 ✓':'關閉')+'</button></div><div class="actions"><button class="btn alt" data-sound="test">🔊 試聽</button><button class="btn alt" data-back="1">返回遊戲</button></div><p class="tip">遊戲進度儲存在目前瀏覽器的本機儲存空間；若清除 Safari 網站資料，進度可能遺失。切換分頁時自動暫停。</p>'}
function render(reset){updateHeader();const sc=$('stage');sc.innerHTML=({zoo:scenePage,build:buildPage,tasks:tasksPage,puzzle:puzzlePage,book:bookPage,manage:managePage,settings:settingsPage}[s.tab]||scenePage)();if(reset)sc.scrollTop=0;sceneCanvas=$('zcanvas');sceneCtx=sceneCanvas?.getContext('2d')||null;}
function updateLive(){updateHeader();root.querySelectorAll('[data-hungry]').forEach(el=>{const h=Math.round(s.animals[el.dataset.hungry]?.hunger||0);el.textContent='🍽️ 飢餓度 '+h+'/100'});root.querySelectorAll('[data-hbar]').forEach(el=>el.style.width=Math.round(s.animals[el.dataset.hbar]?.hunger||0)+'%')}
function audio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}catch(e){return null}}
function tone(hz=600,vol=.025){const ac=audio();if(!ac)return;try{const osc=ac.createOscillator(),gn=ac.createGain(),t=ac.currentTime;osc.type='sine';osc.frequency.value=hz;gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(vol,t+.015);gn.gain.exponentialRampToValueAtTime(.0001,t+.2);osc.connect(gn);gn.connect(ac.destination);osc.start(t);osc.stop(t+.21)}catch(e){}}
function fx(){if(s.fx)tone(660,.032)}function stopMusic(){clearInterval(musicInterval);musicInterval=null}function startMusic(){stopMusic();if(!s.music||document.hidden)return;const notes=[392,440,523,440,349,392,329,349];tone(notes[musicIndex++%notes.length],.01);musicInterval=setInterval(()=>{if(s.music&&!document.hidden)tone(notes[musicIndex++%notes.length],.01)},540)}
function rewardPuzzle(n){let a=animal(s.target);if(puzzles(a)>=9){a=A.find(a=>a.req&&puzzles(a)<9)||a}if(puzzles(a)>=9){s.coins+=n*50;return '已全數完成，換成金幣 '+n*50}const old=puzzles(a);s.pieces[a.id]=Math.min(9,old+n);return a.name+'拼圖 +'+(s.pieces[a.id]-old)+' 片'}
function moneySpend(n){if(s.coins<n){notify('🪙 金幣不足！請先營業、完成任務賺取金幣。');return false}s.coins-=n;return true}
function buy(id){if(id==='stall'){if(s.stall)return;if(!moneySpend(500))return;s.stall=true;notify('🌭🥤 小吃攤已建造！');fx();render(false);return}if(id==='research'){if(s.research.built)return;if(!moneySpend(650))return;s.research.built=true;notify('🔬 保育研究中心建造完成！');fx();render(false);return}const a=animal(id);if(!a)return;if(s.animals[id]){feed(id);return}if(a.req&&puzzles(a)<9)return;if(!moneySpend(a.cost))return;s.animals[id]={mood:85,hunger:20};notify('🐾 '+a.name+'入住了！到建造頁點餵食，照顧牠吧。');fx();render(false)}
function feed(id){const a=animal(id),an=s.animals[id];if(!an)return;if(!moneySpend(30))return;an.hunger=Math.max(0,an.hunger-36);an.mood=Math.min(100,an.mood+7);s.feedToday++;s.feedAll++;fx();notify(a.feed+' 已餵 '+a.name+'！飢餓度降至 '+Math.round(an.hunger)+'/100');const card=root.querySelector('[data-card="'+id+'"]');if(card){const food=document.createElement('span');food.className='food-fly';food.textContent=a.feed;card.appendChild(food);setTimeout(()=>food.remove(),850);updateLive()}const index=A.indexOf(a);animation.food.push({zone:index,t:0,emoji:a.feed});if(s.tab!=='build')render(false)}
function claimTask(id){const t=dailyTasks.find(t=>t.id===id);if(!t||s.tasksClaimed.includes(s.day+':'+id)||t.measure()<t.need)return;s.tasksClaimed.push(s.day+':'+id);s.coins+=t.reward;const r=rewardPuzzle(1);notify('🎁 任務完成！獲得 '+t.reward+' 金幣，'+r);fx();render(false)}
function claimAchievement(id){const a=achDefs.find(a=>a.id===id);if(!a||!a.check()||s.achievementsClaimed.includes(id))return;s.achievementsClaimed.push(id);s.coins+=a.reward;const r=rewardPuzzle(a.pieces);notify('🏆 成就解鎖！'+r);fx();render(false)}
function doResearch(){if(!s.research.built||s.research.lastDay===s.day)return;if(!moneySpend(90))return;s.research.lastDay=s.day;let r=rewardPuzzle(speciesCount()>=3?2:1);notify('🔬 野外考察成功：'+r);fx();render(false)}
function market(type){if(s.marketing.day===s.day||s.mode==='closed')return;const cost=type==='flyer'?120:240;if(!moneySpend(cost))return;s.marketing={type,day:s.day};notify('📣 已啟動'+(type==='flyer'?'街頭傳單':'社群宣傳')+'，今天來客更多！');fx();render(false)}
function satisfaction(){const ids=Object.keys(s.animals),avg=ids.length?ids.reduce((n,id)=>n+(100-s.animals[id].hunger),0)/ids.length:0;return Math.min(100,Math.max(0,Math.round(46+avg*.38+(s.stall?8:0)+(s.visitors>=60?7:0)+(s.feedToday>=2?5:0)-(ids.length?0:25)+(s.marketing.day===s.day?2:0))))}
function closeDay(){if(s.lastRewardDay===s.day)return;s.lastRewardDay=s.day;const score=satisfaction(),cost=50+speciesCount()*45+(s.stall?80:0)+(s.research.built?35:0),rewardCoins=score>=80?180:score>=65?70:0,rewardPieces=score>=80?1:0;if(rewardPieces)rewardPuzzle(rewardPieces);s.coins+=rewardCoins-cost;s.highestScore=Math.max(s.highestScore,score);s.report={day:s.day,score,guests:s.visitors,income:s.earnToday,cost,rewardCoins,rewardPieces};s.mode='closed';s.min=1260;s.acc=0;s.tab='tasks';notify('🌙 閉園結算完成，滿意度 '+score+' 分！');fx();render(true);save()}
function dailyStep(){if(s.mode!=='running')return;const count=speciesCount(),h=Math.floor(s.min/60);const mult=s.marketing.day===s.day?(s.marketing.type==='social'?2:s.marketing.type==='flyer'?1.5:1):1;const guest=count?Math.max(1,Math.round((2+count*1.5)*(h>=11&&h<=17?1.3:.85)*mult)):0;const shopSold=s.stall?Math.round(guest*.45):0,earn=guest*25+shopSold*29;s.visitors+=guest;s.totalGuests+=guest;s.foodToday+=shopSold;s.coins+=earn;s.earnToday+=earn;
Object.values(s.animals).forEach(a=>{a.hunger=Math.min(100,a.hunger+1.15);if(a.hunger>72)a.mood=Math.max(20,a.mood-1)});
s.min+=10;if(s.min>=1260)closeDay();else updateLive()}
function startNext(){if(s.mode==='ready'){s.mode='running';notify('🌅 園區正式開園，遊客開始入園！')}else if(s.mode==='running'){s.mode='paused';notify('⏸ 已暫停，時間與人物停止移動。')}else if(s.mode==='paused'){s.mode='running';notify('▶ 繼續營業，遊客重新開始走動。')}else if(s.mode==='closed'){s.day++;s.min=540;s.visitors=0;s.earnToday=0;s.foodToday=0;s.feedToday=0;s.mode='running';s.report=null;s.marketing={type:'none',day:0};notify('🌅 第 '+s.day+' 天開始營業！')}s.acc=0;fx();render(false);save()}
function navigate(tab){if(tab==='settings')focusBefore=s.tab;s.tab=tab;render(true);fx()}
let profileReady=false;
function avatarButtons(){const box=$('avatars');box.innerHTML=AV.map(a=>'<button type="button" data-avatar="'+a[0]+'" class="'+(a[0]===avatarSelected?'active':'')+'" aria-pressed="'+(a[0]===avatarSelected)+'">'+a[1]+'<small>'+a[2]+'</small></button>').join('')}
function editProfile(edit){profileEdit=edit;avatarSelected=s.profile?.avatar||'capy';$('zooInput').value=s.profile?.name||'口袋動物園';$('keeperInput').value=s.profile?.keeper||'';root.querySelectorAll('[name=gender]').forEach(el=>el.checked=el.value===(s.profile?.gender||'none'));avatarButtons();$('intro').classList.remove('hidden');$('introError').textContent='';$('start').textContent=edit?'💾 儲存園長資料':'🐾 確認資料，開始經營';profileReady=true}
$('start').addEventListener('click',()=>{const name=$('zooInput').value.trim(),keeper=$('keeperInput').value.trim();if(!name||!keeper){$('introError').textContent='請填寫動物園名稱及園長姓名。';return}const gender=root.querySelector('[name=gender]:checked')?.value||'none';s.profile={name,keeper,gender,avatar:avatarSelected};$('intro').classList.add('hidden');notify('🌿 歡迎 '+keeper+' 園長！');render(true);save()});
$('avatars').addEventListener('click',e=>{const b=e.target.closest('[data-avatar]');if(!b)return;avatarSelected=b.dataset.avatar;avatarButtons()});
$('operation').addEventListener('click',e=>{e.preventDefault();startNext()});
root.addEventListener('change',e=>{const el=e.target.closest('[data-staff]');if(!el)return;const id=el.dataset.staff;if(roles.some(r=>r[0]===id)&&outfits[el.value]){s.staff[id]=el.value;notify('👕 '+roles.find(r=>r[0]===id)[1]+'已換上'+outfits[el.value][0]);fx();save()}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b)||b.disabled||b.id==='operation'||b.id==='start'||b.hasAttribute('data-avatar'))return;const d=b.dataset;if(d.nav){navigate(d.nav)}else if(d.speed){s.speed=Number(d.speed);updateHeader();fx();notify('⏩ 已設為 '+s.speed+' 倍速')}else if(d.back){navigate(focusBefore)}else if(d.buy){buy(d.buy)}else if(d.feed){feed(d.feed)}else if(d.claimTask){claimTask(d.claimTask)}else if(d.achieve){claimAchievement(d.achieve)}else if(d.research){doResearch()}else if(d.market){market(d.market)}else if(d.target){s.target=d.target;render(false);fx()}else if(d.explore){if(s.explored===s.day)return;s.explored=s.day;const r=rewardPuzzle(1);notify('🌿 今日探索完成，'+r);render(false);fx()}else if(d.view){s.book=A.findIndex(a=>a.id===d.view);navigate('book')}else if(d.flip){s.book=Math.max(0,Math.min(A.length-1,s.book+Number(d.flip)));render(false);fx()}else if(d.edit){editProfile(true)}else if(d.sound){if(d.sound==='music'){s.music=!s.music;s.music?startMusic():stopMusic()}else if(d.sound==='fx'){s.fx=!s.fx}else tone(700,.03);render(false)}save()});
const ZONES=[{id:'capy',x:12,y:49,w:147,h:94,bg:'#b8d5a6'},{id:'meer',x:203,y:49,w:146,h:94,bg:'#dfca92'},{id:'otter',x:12,y:151,w:147,h:94,bg:'#a1d1c8'},{id:'panda',x:203,y:151,w:146,h:94,bg:'#9dc897'},{id:'elephant',x:12,y:253,w:147,h:94,bg:'#c4d4a8'},{id:'penguin',x:203,y:253,w:146,h:94,bg:'#a0d4e2'},{id:'giraffe',x:12,y:355,w:147,h:94,bg:'#d3cd8b'}];
function pRect(c,x,y,w,h,color){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function textDraw(c,str,x,y,size=11,color='#47321e',align='center'){c.textAlign=align;c.font='900 '+size+'px system-ui';c.fillStyle='#fff3d7';c.fillText(str,x+1,y+1);c.fillStyle=color;c.fillText(str,x,y)}
function drawPerson(c,x,y,shirt,variant=0){x=Math.round(x);y=Math.round(y);pRect(c,x-3,y-12,6,5,variant===0?'#6d4930':'#4c3a2d');pRect(c,x-3,y-8,6,6,'#f4be87');pRect(c,x-5,y-2,10,9,shirt);pRect(c,x-4,y+7,3,6,'#4a5d6c');pRect(c,x+1,y+7,3,6,'#4a5d6c');pRect(c,x-5,y+12,4,3,'#58483b');pRect(c,x+1,y+12,4,3,'#58483b')}
function drawTree(c,x,y,scale=1){pRect(c,x-3*scale,y+4*scale,6*scale,15*scale,'#795b31');pRect(c,x-13*scale,y-8*scale,26*scale,19*scale,'#4d8751');pRect(c,x-9*scale,y-13*scale,18*scale,10*scale,'#73a95e');pRect(c,x-4*scale,y-15*scale,10*scale,5*scale,'#9eca78')}
function buildScene(t){const c=sceneCtx;if(!sceneCanvas||!c)return;const ww=360,hh=550;c.clearRect(0,0,ww,hh);c.imageSmoothingEnabled=false;pRect(c,0,0,ww,hh,'#9cc67e');for(let i=0;i<110;i++){const x=(i*67+25)%355,y=(i*101+13)%547;pRect(c,x,y,2,2,i%3?'#86b96f':'#b0d695')}
// 石板步道
pRect(c,166,12,28,497,'#c6ae83');pRect(c,171,12,18,497,'#ebd6a4');for(let y=21;y<500;y+=28)pRect(c,171,y,18,2,'#d3b88d');for(const z of ZONES){pRect(c,z.x-2,z.y+40,ww/2-z.x+5,15,'#cbb388');pRect(c,z.x-2,z.y+43,ww/2-z.x+5,8,'#e5d1a2')}
// 戲水和花叢
for(let i=0;i<ZONES.length;i++){const z=ZONES[i],a=animal(z.id),own=!!s.animals[z.id];pRect(c,z.x,z.y,z.w,z.h,'#755635');pRect(c,z.x+4,z.y+4,z.w-8,z.h-8,z.bg);for(let j=0;j<5;j++)pRect(c,z.x+9+j*27,z.y+z.h-10,5,4,i%2?'#80ae5b':'#78b1a0');if(z.id==='otter'||z.id==='capy'||z.id==='penguin'){pRect(c,z.x+12,z.y+42,56,25,'#7bc7d5');pRect(c,z.x+15,z.y+45,42,5,'#a1e3e5')}if(z.id==='panda')drawTree(c,z.x+22,z.y+29,.68);
if(own){const phase=s.mode==='running'?t:0,dx=Math.sin(phase*.0013+i*1.7)*9,dy=Math.cos(phase*.001+i*2.2)*3,im=images[z.id];if(im&&im.complete)c.drawImage(im,Math.round(z.x+z.w/2-27+dx),Math.round(z.y+14+dy),54,54);const hunger=Math.round(s.animals[z.id].hunger);pRect(c,z.x+z.w-27,z.y+7,18,4,'#fff9e3');pRect(c,z.x+z.w-27,z.y+7,18*hunger/100,4,hunger>70?'#db673e':'#dcb563')}else{textDraw(c,'?',z.x+z.w/2,z.y+49,28,'#8d785d');}
textDraw(c,a.name+(own?'':' 🔒'),z.x+z.w/2,z.y+z.h-10,12,'#513824');}
// 建築、攤位和研究中心
const extraX=207,extraY=359;pRect(c,extraX,extraY,139,43,'#957451');pRect(c,extraX+4,extraY+4,131,35,s.stall?'#fbe5aa':'#b6c59e');textDraw(c,s.stall?'🌭🥤 小吃攤':'＋ 小吃攤',extraX+68,extraY+27,12);pRect(c,extraX,410,139,43,'#846743');pRect(c,extraX+4,414,131,35,s.research.built?'#c0dad4':'#a6b5a4');textDraw(c,s.research.built?'🔬 保育研究中心':'＋ 研究中心',extraX+68,437,11);
// 草叢與大門
for(const [x,y] of [[5,23],[354,19],[3,468],[356,477],[36,474],[325,489]])drawTree(c,x,y,.75);
pRect(c,124,506,112,37,'#8e633e');pRect(c,131,511,98,27,'#f9deaa');textDraw(c,'🐾 歡迎入園',180,530,12);
// 員工隨制服更換
const keeperX=145,keeperY=214+(s.mode==='running'?Math.sin(t*.002)*8:0),guideX=186,guideY=461+(s.mode==='running'?Math.sin(t*.0014)*5:0),vendorX=290,vendorY=470;
drawPerson(c,keeperX,keeperY,outfits[s.staff.keeper]?.[1]||'#bd9b60');drawPerson(c,guideX,guideY,outfits[s.staff.guide]?.[1]||'#426a3b',1);drawPerson(c,vendorX,vendorY,outfits[s.staff.vendor]?.[1]||'#ddc498');
if(s.mode==='running'&&speciesCount()){for(let i=0;i<Math.min(12,2+speciesCount()*2);i++){const fraction=((t*.015+i*64)%465)/465;const yy=483-fraction*459,offset=(i%4===0?-8:i%4===1?8:i%4===2?-3:4);drawPerson(c,180+offset,yy,['#b35d47','#d8b969','#7895b1','#c881a2'][i%4],i%3)}}
animation.food=animation.food.filter(f=>f.t<1.15);animation.food.forEach(f=>{const z=ZONES[f.zone];if(!z)return;const p=f.t;const x=180+(z.x+z.w/2-180)*p,y=485+(z.y+35-485)*p-60*Math.sin(Math.PI*p);c.font='20px system-ui';c.fillText(f.emoji,x,y);if(s.mode==='running'||s.mode==='ready'||s.mode==='paused')f.t+=.025});
}
function frame(now){const dt=Math.min(50,Math.max(0,now-lastStamp));lastStamp=now;if(s.mode==='running'&&!document.hidden)animation.t+=dt;if(s.tab==='zoo'&&!document.hidden)buildScene(animation.t);requestAnimationFrame(frame)}
$('stage').addEventListener('click',e=>{const canvas=e.target.closest('#zcanvas');if(!canvas)return;const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*360/r.width,y=(e.clientY-r.top)*550/r.height;for(const z of ZONES){if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h){s.tab='build';notify('🔨 找到'+animal(z.id).name+'棲地，請到建造卡片照顧牠。');render(true);save();return}}if(x>=207&&x<=346&&y>=359&&y<=402){s.tab='build';render(true)}else if(x>=207&&x<=346&&y>=410&&y<=453){s.tab='manage';render(true)}});
let last=Date.now();setInterval(()=>{const now=Date.now(),dt=Math.min(300,Math.max(0,now-last));last=now;if(document.hidden||s.mode!=='running')return;s.acc+=dt*s.speed;while(s.acc>=20000&&s.mode==='running'){s.acc-=20000;dailyStep();save()}},170);
document.addEventListener('visibilitychange',()=>{last=Date.now();if(document.hidden){if(s.mode==='running')s.mode='paused';stopMusic();save();updateHeader()}else if(s.music)startMusic()});window.addEventListener('pagehide',save);
render(true);if(!s.profile)editProfile(false);else $('intro').classList.add('hidden');requestAnimationFrame(frame);
// Browser-smoke-test helpers only enabled when ?test=1.
if(new URLSearchParams(location.search).has('test'))window.__pzTest={state:s,tick:dailyStep,close:closeDay,rerender:()=>render(false)};
})();
</script></body></html>
