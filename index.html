/* v1.7 responsive improvements */
#game{width:min(100%,590px)}
.stage{padding-bottom:24px}
.tabs button{min-height:44px;touch-action:manipulation}
.foot{padding-bottom:max(10px,env(safe-area-inset-bottom))}.foot button{min-height:64px;user-select:none}
.scene-nav{display:flex;gap:5px;align-items:center;justify-content:space-between;margin:5px 0 8px}
.scene-nav button{min-height:44px;min-width:68px}
.catalog-bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.catalog-bar button{padding:7px 9px;min-height:40px;border:2px solid #aa8d63;border-radius:8px;background:#fff8e6;font-weight:850;font-size:12px}
.catalog-bar button.active{background:#cee9aa;border-color:#5f883f}
.big-stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.big-stat>div{background:#e7f0d8;border:2px solid #9abe75;border-radius:10px;padding:9px;text-align:center;font-weight:900;color:#395b2b}
.big-stat b{display:block;font-size:23px;color:#2c4e1f}
.achiev-header{background:#e9edce;border:2px solid #9aaa77;border-radius:12px;padding:12px;margin-bottom:9px;color:#3b522e}
.achiev-header strong{font-size:20px}
.achiev-meter{height:15px;background:#f4e9d2;border:1px solid #9b8a62;border-radius:10px;overflow:hidden;margin:8px 0}
.achiev-meter span{display:block;background:#79a65b;height:100%}
.achiev-list{display:grid;gap:6px}
.achiev{padding:9px;border:1px solid #cbb18b;border-radius:8px;background:#fffbef;display:flex;align-items:center;gap:8px}
.achiev .ach-info{flex:1;min-width:0;font-size:12px}
.achiev .ach-info b{color:#483220}
.achiev .ach-info small{display:block;color:#745b40;margin-top:2px}
.achiev button{min-height:42px;padding:5px;font-size:11px;max-width:104px}
.staff-view{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;align-items:center;background:#fffaec;border:1px solid #d9c39d;padding:8px;border-radius:10px;margin:8px 0}
.staff-art{display:grid;place-items:center;width:96px;height:105px;background:repeating-linear-gradient(0deg,#cfe2b2 0 9px,#ddefc9 9px 18px);border:3px solid #96b37b;border-radius:8px}
.staff-art svg{width:80px;height:96px;image-rendering:pixelated}
.staff-view select{min-height:46px;max-width:100%;width:100%;background:#fff7dc;border:2px solid #b99a6a;border-radius:8px;color:#3d301d;padding:4px}
.feedback{border:1px solid #bca078;background:#fff6de;padding:9px;border-radius:8px;margin:7px 0;font-size:12px}
.feedback b{display:block;margin-bottom:4px}.feedback p{margin:3px 0}
.faci-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.faci-item{background:#fffbef;border:2px solid #c4a880;border-radius:10px;padding:10px;text-align:center;font-size:12px}
.faci-item strong{display:block;font-size:14px}.faci-item button{width:100%;margin-top:6px}
.card .species-badge{font-size:11px;color:#47652c;background:#e9efcf;padding:2px 7px;border-radius:12px}
.map-legend{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}.map-legend span{font-size:10px;padding:4px 7px;border-radius:7px;background:#fffaec;border:1px solid #cab387}
.bookpage-switch{width:100%;min-height:44px;border:2px solid #a48b61;border-radius:8px;background:#fff8e5;color:#47341f;padding:5px}
@media(max-width:370px){.staff-view{grid-template-columns:80px minmax(0,1fr)}.staff-art{width:78px}.achiev button{max-width:90px}.card>img{height:64px}}

.art-header{position:absolute;z-index:2;left:2%;right:2%;top:2.1%;height:8.3%;display:flex;align-items:center;justify-content:space-between;gap:5px;background:linear-gradient(150deg,#a97648,#714324 55%,#9b633a);border:4px solid #e6bd81;border-radius:17px;box-shadow:0 3px 2px #4934208c;padding:4px 7px;color:#fff5db;text-shadow:1px 2px #3b2417}
.art-header .hlogo{font-weight:1000;font-size:14px;line-height:1.12;flex:1;min-width:0}
.art-header .hlogo span{display:block;font-size:9px;color:#efdfbb}
.art-header .h-stat{text-align:center;font-weight:900;font-size:13px;min-width:0}
.art-header .h-stat small{display:block;font-size:9px;color:#f4e5c9}
.art-header button{flex:0 0 auto;min-width:35px;min-height:35px;border:2px solid #5c3a22;border-radius:9px;background:#ffdb9c;font-size:20px;color:#4b321f;box-shadow:inset 0 2px #fff1d2}
.art-floating{position:absolute;z-index:3;top:11%;right:3%;display:flex;gap:5px;align-items:center}
.art-floating button,.art-floating span{font-size:11px;font-weight:900;padding:5px 8px;border:2px solid #946539;border-radius:12px;background:#fff0cfed;color:#684422}
.art-floating button{min-height:36px}
.art-hotspot{position:absolute;z-index:2;border:2px dashed transparent;background:transparent;border-radius:25%;color:transparent;touch-action:manipulation}
.art-hotspot:active,.art-hotspot:focus-visible{background:#ffff9545;border-color:#fff0ae;outline:none}
.art-hotspot .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.art-tag{position:absolute;z-index:2;pointer-events:none;background:#fff0cbdc;color:#59391d;padding:3px 7px;font-weight:900;font-size:10px;border-radius:9px;border:2px solid #a97642;box-shadow:0 2px 2px #5c3a2155;white-space:nowrap}
.art-tag.owned{background:#d7f1a7f0;color:#46602b}
.art-scene-tip{position:absolute;left:4%;right:4%;bottom:calc(136px + env(safe-area-inset-bottom));z-index:1;border:3px solid #8b5830;border-radius:17px;background:#fff3d9f2;padding:7px 11px;font-weight:900;color:#633e25;font-size:11px;text-align:center;box-shadow:0 2px 3px #3d2d2050}
.art-scene-menu{position:absolute;top:12%;left:2%;display:flex;flex-direction:column;gap:7px;z-index:3}
.art-scene-menu button{border:3px solid #84502b;border-radius:11px;background:linear-gradient(#ffefc5,#f5bf7d);padding:8px 7px;font-weight:950;font-size:12px;color:#5e3a21;box-shadow:0 3px #6b4628}
.art-scene-next{position:absolute;right:2%;top:23%;display:flex;flex-direction:column;gap:6px}
.art-scene-next button{border:2px solid #8b5f37;border-radius:12px;background:#ffecb9e8;padding:8px 7px;min-height:45px;font-weight:950;color:#53391f}
.art-book-content{position:absolute;top:24.3%;left:3%;right:3%;height:36.7%;border:5px solid #946137;border-radius:18px;background:linear-gradient(#fff5df,#fdf0d6);color:#53351f;padding:8px;box-shadow:0 4px 3px #6440287a;display:flex;flex-direction:column}
.art-book-header{display:flex;justify-content:space-between;align-items:center;gap:5px;border-bottom:2px solid #d2ad7a;padding-bottom:5px;font-weight:1000;font-size:17px}
.art-book-header small{font-size:10px;white-space:nowrap}
.art-book-details{flex:1;min-height:0;display:grid;grid-template-columns:48% 52%;gap:6px;padding-top:6px}
.art-book-details .portrait{position:relative;min-height:0;border:4px solid #c5a277;border-radius:13px;background:#c8dfb3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art-book-details .portrait>img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover;image-rendering:auto}
.art-book-details .portrait .mosaic{width:100%;max-width:none;border:none;border-radius:0;align-self:center}
.art-book-details .data{font-size:clamp(10px,2.9vw,13px);color:#55371f;line-height:1.42;overflow:auto;min-width:0;padding:3px}
.art-book-details .data *{color:#55371f!important}
.art-book-details .data p{margin:3px 0}
.art-book-details .data h3{font-size:14px;margin:0 0 5px}
.art-book-controls{position:absolute;left:3%;right:3%;top:62.5%;display:flex;align-items:center;justify-content:space-between;gap:5px;background:#fff0cedd;padding:5px;border:3px solid #a97549;border-radius:12px}
.art-book-controls button,.art-filter button{padding:5px 7px;border:2px solid #987046;background:linear-gradient(#fff4d7,#f3cb8b);border-radius:9px;min-height:35px;font-size:11px;font-weight:900;color:#5a3a20}
.art-book-gallery{position:absolute;left:2%;right:2%;top:69%;bottom:calc(142px + env(safe-area-inset-bottom));background:#fcebd0ee;border:3px solid #9e6d41;border-radius:13px;padding:6px;overflow:auto}
.art-book-gallery .entries{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.art-book-gallery .entries button{min-width:0;border:2px solid #ac824c;border-radius:10px;background:#fff4dd;padding:4px 2px;font-size:10px;font-weight:900;color:#5a3c26;display:flex;flex-direction:column;align-items:center;gap:2px}
.art-book-gallery .entries button.active{border:3px solid #63a13b;background:#dff2ae}
.art-book-gallery .entries button img{display:block;width:100%;height:54px;object-fit:contain}
.art-filter{display:flex;gap:4px;overflow:auto;margin-bottom:5px}
.art-filter button{flex:0 0 auto;padding:4px 7px;min-height:30px}
.art-filter button.active{background:#b9e67e}
.art-book-gallery .entries small{font-size:9px;color:#88603b}
.art-pill{display:inline-block;background:#fff8e6;border:1px solid #d8b88b;border-radius:10px;padding:2px 5px;font-size:10px;font-weight:800}
.art-menu-return{position:absolute;z-index:3;left:3%;top:12%;background:#ffe8b9;border:3px solid #87512b;border-radius:12px;padding:6px 11px;color:#55371e;font-weight:900}
@media(max-width:360px){.art-header .hlogo{font-size:11px}.art-header .h-stat{font-size:11px}.art-mode .tabs button{font-size:10px;height:59px}.art-mode .foot{bottom:calc(73px + env(safe-area-inset-bottom))}.art-scene-tip{bottom:calc(122px + env(safe-area-inset-bottom))}.art-book-gallery{bottom:calc(128px + env(safe-area-inset-bottom))}.art-book-details .data{font-size:10px}.art-book-content{padding:5px}}

/* v1.9: align clickable controls to the illustrated artwork; remove duplicated labels */
#home button .sr-only{display:none!important}
.art-mode .tabs{display:none!important}

function getDailyTasks(){
if(s.taskDay!==s.day||!Array.isArray(s.dailyMissionIds)||s.dailyMissionIds.length!==10){
let pool=dailyTaskPool.filter(t=>!t.requires||t.requires());
let seed=(s.day*1103515245+12345)>>>0;const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
for(let i=pool.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
s.dailyMissionIds=pool.slice(0,10).map(t=>t.id);s.taskDay=s.day;save();
}
return s.dailyMissionIds.map(id=>dailyTaskPool.find(t=>t.id===id)).filter(Boolean)
}

function render(reset){root.classList.toggle('art-mode',s.tab==='zoo'&&s.mapArea===0||s.tab==='book');root.dataset.screen=s.tab;updateHeader();const sc=$('stage');sc.innerHTML=({zoo:scenePage,build:buildPage,tasks:tasksPage,puzzle:puzzlePage,book:bookPage,manage:managePage,settings:settingsPage}[s.tab]||scenePage)();if(reset)sc.scrollTop=0;sceneCanvas=$('zcanvas');sceneCtx=sceneCanvas?.getContext('2d')||null;}
function updateLive(){updateHeader();root.querySelectorAll('[data-hud=coins]').forEach(el=>el.textContent=fmt(s.coins));root.querySelectorAll('[data-hud=guests]').forEach(el=>el.textContent=fmt(s.visitors));let cl=$('artClock');if(cl)cl.textContent='第'+s.day+'天 '+time(s.min);root.querySelectorAll('[data-hungry]').forEach(el=>{const h=Math.round(s.animals[el.dataset.hungry]?.hunger||0);el.textContent='🍽️ 飢餓度 '+h+'/100'});root.querySelectorAll('[data-hbar]').forEach(el=>el.style.width=Math.round(s.animals[el.dataset.hbar]?.hunger||0)+'%')}
function audio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}catch(e){return null}}
function tone(hz=600,vol=.025,duration=.19,type='triangle',when=0){const ac=audio();if(!ac)return;try{const osc=ac.createOscillator(),gn=ac.createGain(),t=ac.currentTime+when;osc.type=type;osc.frequency.setValueAtTime(hz,t);gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.008);gn.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gn);gn.connect(ac.destination);osc.start(t);osc.stop(t+duration+.02)}catch(e){}}

function startMusic(){stopMusic();if(!s.music||document.hidden)return;const play=()=>{if(!s.music||document.hidden)return;const i=musicIndex++;const note=melody[i%melody.length];tone(note,.013,.17,'triangle');if(i%2===0)tone(bassline[Math.floor(i/4)%bassline.length],.012,.23,'sine',.03);if(i%4===3)tone(1568,.004,.05,'square',.01)};play();musicInterval=setInterval(play,285)}
const marketTypes={flyer:{name:'街頭傳單',icon:'📄',cost:120,mult:1.5},social:{name:'社群宣傳',icon:'📱',cost:240,mult:2},radio:{name:'廣播節目',icon:'📻',cost:430,mult:2.5},tv:{name:'電視廣告',icon:'📺',cost:800,mult:3.3}};

function rewardPuzzle(n){let a=animal(s.target);if(puzzles(a)>=9){a=A.find(a=>a.req&&puzzles(a)<9)||a}if(puzzles(a)>=9){s.coins+=n*50;return '已全數完成，換成金幣 '+n*50}const old=puzzles(a);s.pieces[a.id]=Math.min(9,old+n);return a.name+'拼圖 +'+(s.pieces[a.id]-old)+' 片'}
function moneySpend(n){if(s.coins<n){notify('🪙 金幣不足！請先營業、完成任務賺取金幣。');return false}s.coins-=n;return true}
function buy(id){
if(facilities[id]){const f=facilities[id];const key=id==='bench'?'benches':id==='bin'?'bins':id;const exists=id==='bench'||id==='bin'?s[key]>=12:id==='research'?s.research.built:id==='cleaner'?s.cleanerHired:!!s[id];if(exists)return;if(!moneySpend(f.price))return;
if(id==='bench'||id==='bin')s[key]++;else if(id==='research')s.research.built=true;else if(id==='cleaner')s.cleanerHired=true;else s[id]=true;
notify(f.icon+' '+f.name+(id==='cleaner'?'已到職！':'建造完成！'));fx('reward');render(false);save();return}
const a=animal(id);if(!a)return;if(s.animals[id]){feed(id);return}if(a.req&&puzzles(a)<9)return;if(!moneySpend(a.cost))return;s.animals[id]={mood:85,hunger:20};notify('🐾 '+a.name+'入住！可到建造頁照顧牠。');fx('reward');render(false)}
function feed(id){const a=animal(id),an=s.animals[id];if(!an)return;if(!moneySpend(30))return;an.hunger=Math.max(0,an.hunger-36);an.mood=Math.min(100,an.mood+7);s.feedToday++;s.feedAll++;fx('feed');notify(a.feed+' 已餵 '+a.name+'！飢餓度降至 '+Math.round(an.hunger)+'/100');const card=root.querySelector('[data-card="'+id+'"]');if(card){const food=document.createElement('span');food.className='food-fly';food.textContent=a.feed;card.appendChild(food);setTimeout(()=>food.remove(),850);updateLive()}animation.food.push({id:id,t:0,emoji:a.feed});if(s.tab!=='build')render(false)}

function claimTask(id){const t=getDailyTasks().find(t=>t.id===id);if(!t||s.tasksClaimed.includes(s.day+':'+id)||t.measure()<t.need)return;s.tasksClaimed.push(s.day+':'+id);s.coins+=t.reward;const r=rewardPuzzle(1);notify('🎁 任務完成！獲得 '+t.reward+' 金幣，'+r);fx('reward');render(false)}
function claimAchievement(id){const a=achDefs.find(a=>a.id===id);if(!a||!a.check()||s.achievementsClaimed.includes(id))return;s.achievementsClaimed.push(id);s.coins+=a.reward;const r=rewardPuzzle(a.pieces);notify('🏆 成就解鎖！'+r);fx('reward');render(false)}
function doResearch(){if(!s.research.built||s.research.lastDay===s.day)return;if(!moneySpend(90))return;s.research.lastDay=s.day;let r=rewardPuzzle(speciesCount()>=3?2:1);notify('🔬 野外考察成功：'+r);fx();render(false)}
function market(type){const m=marketTypes[type];if(!m||s.marketing.day===s.day||s.mode==='closed')return;if(!moneySpend(m.cost))return;s.marketing={type,day:s.day};s.marketingAll++;notify(m.icon+' 已安排'+m.name+'，遊客來園人數提升 '+Math.round((m.mult-1)*100)+'%！');fx('reward');render(false)}
function satisfaction(){const ids=Object.keys(s.animals),avg=ids.length?ids.reduce((n,id)=>n+(100-s.animals[id].hunger),0)/ids.length:0;return Math.min(100,Math.max(0,Math.round(43+avg*.32+(s.stall?5:0)+(s.souvenir?4:0)+(s.toilet?7:-8)+(s.benches?Math.min(5,s.benches*2):-4)+(s.bins?Math.min(5,s.bins*2):-5)+(s.cleanerHired?5:-3)+(s.visitors>=60?5:0)+(s.feedToday>=2?5:0)-(ids.length?0:22)-Math.min(24,s.trash*.29)) ))}
function guestFeedback(score){const praises=[],complaints=[];
if(speciesCount()>=3)praises.push('動物種類很豐富，今天看到好多可愛的動物！');else praises.push('這個小動物園很有潛力，期待更多動物入住。');
if(s.stall)praises.push('熱狗和汽水很方便，逛累了可以吃點東西！');
if(s.souvenir)praises.push('紀念品店有趣，想帶一份小禮物回家！');
if(s.toilet)praises.push('園區有廁所真的方便多了。');else complaints.push('走好久都找不到廁所，希望能增設。');
if(s.benches)praises.push('步道旁有椅子可以休息，很貼心。');else complaints.push('逛累了沒有地方坐，想要休息椅。');
if(s.bins>=2)praises.push('垃圾桶設置很方便，園區感覺很整潔。');else complaints.push('垃圾桶有點少，吃完東西不方便丟垃圾。');
if(s.trash>=30)complaints.push('地上垃圾越來越多，應該要有人整理。');else if(s.cleanerHired)praises.push('有看到清潔工友認真打掃，環境很舒服。');
if(Object.values(s.animals).some(a=>a.hunger>65))complaints.push('有動物看起來有點餓，希望飼育員多照顧。');
if(!s.souvenir)complaints.push('如果有紀念品店，就能把回憶帶回家。');
if(score>=85)praises.push('這是今天最開心的行程，下次還想再來！');
if(!complaints.length)complaints.push('希望未來能增加更多動物和活動！');
return {praises:praises.slice(0,4),complaints:complaints.slice(0,4)};
}
function closeDay(){if(s.lastRewardDay===s.day)return;s.lastRewardDay=s.day;const score=satisfaction(),cost=50+speciesCount()*45+(s.stall?80:0)+(s.research.built?35:0)+(s.souvenir?65:0)+(s.toilet?40:0)+(s.cleanerHired?55:0)+s.benches*3+s.bins*2,rewardCoins=score>=80?180:score>=65?70:0,rewardPieces=score>=80?1:0;if(rewardPieces)rewardPuzzle(rewardPieces);s.coins+=rewardCoins-cost;s.highestScore=Math.max(s.highestScore,score);s.daysClosed++;s.report={day:s.day,score,guests:s.visitors,income:s.earnToday,cost,rewardCoins,rewardPieces,...guestFeedback(score)};s.mode='closed';s.min=1260;s.acc=0;s.tab='tasks';notify('🌙 閉園結算：滿意度 '+score+' 分。查看遊客留言！');fx('reward');render(true);save()}
function dailyStep(){if(s.mode!=='running')return;const count=speciesCount(),h=Math.floor(s.min/60),m=s.marketing.day===s.day?marketTypes[s.marketing.type]:null;const guest=count?Math.max(1,Math.round((2+count*1.5)*(h>=11&&h<=17?1.3:.85)*(m?.mult||1))):0;
const shopSold=s.stall?Math.round(guest*.45):0,souvenirSold=s.souvenir?Math.round(guest*.29):0,toiletUses=s.toilet?Math.ceil(guest*.16):0,benchUses=s.benches?Math.min(guest,Math.round(guest*.12*s.benches)):0;
const earn=guest*25+shopSold*29+souvenirSold*55;s.visitors+=guest;s.totalGuests+=guest;s.foodToday+=shopSold;s.souvenirToday+=souvenirSold;s.souvenirAll+=souvenirSold;s.toiletUsesToday+=toiletUses;s.toiletUsesAll+=toiletUses;s.benchUsesToday+=benchUses;s.coins+=earn;s.earnToday+=earn;s.totalIncome+=earn;
// Trash builds up during visits. Bins reduce litter; hired janitor actively cleans each time slice.
s.trash=Math.min(100,Math.max(0,s.trash+guest*(s.bins>0?.045:.16)));if(s.cleanerHired){const before=s.trash;s.trash=Math.max(0,s.trash-3.8);if(before>s.trash){s.cleanAll++;s.cleanToday++;}}
Object.values(s.animals).forEach(a=>{a.hunger=Math.min(100,a.hunger+1.15);if(a.hunger>72)a.mood=Math.max(20,a.mood-1)});
s.min+=10;if(s.min>=1260)closeDay();else updateLive()}

function editProfile(edit){profileEdit=edit;avatarSelected=s.profile?.avatar||'capy';$('zooInput').value=s.profile?.name||'口袋動物園';$('keeperInput').value=s.profile?.keeper||'';root.querySelectorAll('[name=gender]').forEach(el=>el.checked=el.value===(s.profile?.gender||'none'));avatarButtons();$('intro').classList.remove('hidden');$('introError').textContent='';$('start').textContent=edit?'💾 儲存園長資料':'🐾 確認資料，開始經營';profileReady=true}

function showHome(){if(s.mode==='running'){s.mode='paused';save()}stopMusic();$('intro').classList.add('hidden');$('home').classList.remove('hidden');const msg=$('homeStatus');msg.textContent='';msg.style.display='none'}
$('home').addEventListener('click',e=>{const b=e.target.closest('[data-home]');if(!b)return;const action=b.dataset.home;fx('click');if(action==='new'){if(s.profile&&!window.confirm('開始新遊戲會清除目前的動物園進度，確定嗎？'))return;if(s.profile){Object.assign(s,JSON.parse(JSON.stringify(initial)));save()}$('home').classList.add('hidden');editProfile(false)}else if(action==='continue'){if(!s.profile){$('home').classList.add('hidden');editProfile(false)}else{$('home').classList.add('hidden');s.tab='zoo';s.mapArea=0;render(true);if(s.music)startMusic()}}else if(action==='settings'){if(!s.profile){const msg=$('homeStatus');msg.textContent='首次遊玩請先建立園長資料，再進入設定。';msg.style.display='block'}else navigate('settings')}else if(action==='book'){if(!s.profile){const msg=$('homeStatus');msg.textContent='請先建立園長資料，即可查看動物圖鑑。';msg.style.display='block'}else navigate('book')}else if(action==='notice'){const msg=$('homeStatus');msg.textContent='v1.9：移除重複按鍵，精簡圖鑑介面！';msg.style.display='block'}else if(action==='cloud'){const msg=$('homeStatus');msg.textContent='雲端備份尚未開放；目前進度只儲存在此瀏覽器。';msg.style.display='block'}});
$('start').addEventListener('click',()=>{const name=$('zooInput').value.trim(),keeper=$('keeperInput').value.trim();if(!name||!keeper){$('introError').textContent='請填寫動物園名稱及園長姓名。';return}const gender=root.querySelector('[name=gender]:checked')?.value||'none';s.profile={name,keeper,gender,avatar:avatarSelected};$('intro').classList.add('hidden');notify('🌿 歡迎 '+keeper+' 園長！');render(true);save()});
$('avatars').addEventListener('click',e=>{const b=e.target.closest('[data-avatar]');if(!b)return;avatarSelected=b.dataset.avatar;avatarButtons()});
$('operation').addEventListener('click',e=>{e.preventDefault();startNext()});
root.addEventListener('change',e=>{const el=e.target.closest('[data-staff]');if(!el){if(e.target.matches('[data-target-select]')){s.target=e.target.value;render(false);save()}return;}const id=el.dataset.staff;if(roles.some(r=>r[0]===id)&&outfits[el.value]){s.staff[id]=el.value;notify('👕 '+roles.find(r=>r[0]===id)[1]+'已換上'+outfits[el.value][0]);fx();render(false);save()}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b)||b.disabled||b.id==='operation'||b.id==='start'||b.hasAttribute('data-avatar'))return;const d=b.dataset;if(d.nav){navigate(d.nav)}else if(d.speed){s.speed=Number(d.speed);updateHeader();fx();notify('⏩ 已設為 '+s.speed+' 倍速')}else if(d.back){navigate(focusBefore)}else if(d.buy){buy(d.buy)}else if(d.feed){feed(d.feed)}else if(d.claimTask){claimTask(d.claimTask)}else if(d.achieve){claimAchievement(d.achieve)}else if(d.research){doResearch()}else if(d.market){market(d.market)}else if(d.filter){s.buildFilter=d.filter;render(false)}else if(d.area){s.mapArea=Math.min(4,Math.max(0,s.mapArea+Number(d.area)));render(false);fx()}else if(d.mapAnimal){const a=animal(d.mapAnimal);s.tab='build';s.buildFilter='owned';if(!s.animals[d.mapAnimal])s.buildFilter=a.group;notify('🔨 開啟'+a.name+'棲地，請在建造清單中查看。');render(true)}else if(d.bookFilter){s.bookFilter=d.bookFilter;const first=A.findIndex(a=>bookCategory(a,d.bookFilter));if(first>=0)s.book=first;render(false)}else if(d.menu){showHome()}else if(d.showAch){s.achShowAll=!s.achShowAll;render(false)}else if(d.target){s.target=d.target;render(false);fx()}else if(d.explore){if(s.explored===s.day)return;s.explored=s.day;const r=rewardPuzzle(1);notify('🌿 今日探索完成，'+r);render(false);fx()}else if(d.view){s.book=A.findIndex(a=>a.id===d.view);navigate('book')}else if(d.flip){const filtered=bookCollection();const index=filtered.findIndex(a=>a.id===A[s.book].id);const next=filtered[Math.max(0,Math.min(filtered.length-1,index+Number(d.flip)))];if(next)s.book=A.indexOf(next);render(false);fx()}else if(d.edit){editProfile(true)}else if(d.sound){if(d.sound==='music'){s.music=!s.music;s.music?startMusic():stopMusic()}else if(d.sound==='fx'){s.fx=!s.fx}else tone(700,.03);render(false)}save()});
function zonesForArea(){const a=A.slice(s.mapArea*10,s.mapArea*10+10);return a.map((species,i)=>({id:species.id,index:s.mapArea*10+i,x:i%2===0?9:200,y:43+Math.floor(i/2)*102,w:149,h:88,bg:['#b9d39d','#e1ca94','#b6d9c3','#a5c994','#d5d2a3'][i%5]}))}
function pRect(c,x,y,w,h,color){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function textDraw(c,str,x,y,size=11,color='#47321e',align='center'){c.textAlign=align;c.font='900 '+size+'px system-ui';c.fillStyle='#fff3d7';c.fillText(str,x+1,y+1);c.fillStyle=color;c.fillText(str,x,y)}
function drawPerson(c,x,y,shirt,variant=0,hat=false){x=Math.round(x);y=Math.round(y);pRect(c,x-4,y-12,8,6,hat?'#d2a56d':variant===0?'#6d4930':'#4c3a2d');if(hat){pRect(c,x-6,y-16,12,4,shirt);pRect(c,x-4,y-19,3,5,shirt);pRect(c,x+2,y-19,3,5,shirt)}pRect(c,x-3,y-7,7,7,'#eab588');pRect(c,x-5,y,11,9,shirt);pRect(c,x-4,y+8,3,6,'#4a5d6c');pRect(c,x+1,y+8,3,6,'#4a5d6c')}
function drawTree(c,x,y,scale=1){pRect(c,x-3*scale,y+4*scale,6*scale,15*scale,'#795b31');pRect(c,x-13*scale,y-8*scale,26*scale,19*scale,'#4d8751');pRect(c,x-9*scale,y-13*scale,18*scale,10*scale,'#73a95e');pRect(c,x-4*scale,y-15*scale,10*scale,5*scale,'#9eca78')}
function buildScene(t){const c=sceneCtx;if(!sceneCanvas||!c)return;const ww=360,hh=650,zones=zonesForArea();c.clearRect(0,0,ww,hh);c.imageSmoothingEnabled=false;pRect(c,0,0,ww,hh,'#9cc67e');for(let i=0;i<130;i++){const x=(i*67+25)%355,y=(i*101+13)%547;pRect(c,x,y,2,2,i%3?'#86b96f':'#b0d695')}
// Visitor path, sidewalks and paddocks
pRect(c,167,12,26,536,'#c6ae83');pRect(c,171,12,18,536,'#ebd6a4');for(let y=21;y<544;y+=27)pRect(c,171,y,18,2,'#cbae7d');
for(const z of zones){const a=animal(z.id),own=!!s.animals[z.id];pRect(c,z.x,z.y,z.w,z.h,'#755635');pRect(c,z.x+4,z.y+4,z.w-8,z.h-8,z.bg);pRect(c,z.x+8,z.y+z.h-17,z.w-16,3,'#9bb96c');for(let k=0;k<4;k++)pRect(c,z.x+10+k*31,z.y+z.h-10,4,4,'#74a357');if(['溪流','河川','濕地','海洋','海岸','湖泊'].some(h=>a.hab.includes(h))){pRect(c,z.x+12,z.y+39,54,23,'#7ac0d2');pRect(c,z.x+15,z.y+42,44,4,'#a4e0df')}if(['森林','雨林'].includes(a.hab))drawTree(c,z.x+26,z.y+25,.55);
if(own){const phase=s.mode==='running'?t:0,dx=Math.sin(phase*.0013+z.index*1.7)*9,dy=Math.cos(phase*.001+z.index*2.2)*3,im=images[z.id];if(im&&im.complete&&im.naturalWidth)c.drawImage(im,Math.round(z.x+z.w/2-27+dx),Math.round(z.y+7+dy),54,54);const hunger=Math.round(s.animals[z.id].hunger);pRect(c,z.x+z.w-30,z.y+7,20,5,'#fff9e3');pRect(c,z.x+z.w-30,z.y+7,20*hunger/100,5,hunger>70?'#db673e':'#dcb563')}
else{textDraw(c,'?',z.x+z.w/2,z.y+48,25,'#9a8664')}
textDraw(c,a.name+(own?'':' 🔒'),z.x+z.w/2,z.y+z.h-8,11,'#513824')}
// benches and garbage bins are installed evenly along the footpath
for(let i=0;i<s.benches;i++){const y=35+(i%6)*85;const x=i%2?190:154;pRect(c,x-8,y,16,5,'#92663e');pRect(c,x-7,y+5,2,6,'#735333');pRect(c,x+5,y+5,2,6,'#735333')}
for(let i=0;i<s.bins;i++){const y=73+(i%6)*84,x=i%2?195:165;pRect(c,x-5,y,10,13,'#4c7880');pRect(c,x-6,y,12,3,'#344e5b')}
// Amenities at the service plaza
pRect(c,1,550,358,94,'#98b574');pRect(c,4,552,352,35,'#e7d5ae');pRect(c,4,593,352,46,'#d7b98b');
const amenities=[['stall',4,554,84,'🌭 小吃'],['souvenir',91,554,84,'🎁 紀念'],['toilet',178,554,84,'🚻 廁所'],['research',265,554,91,'🔬 研究']];
for(const [id,x,y,w,label] of amenities){const active=id==='research'?s.research.built:s[id];pRect(c,x,y,w,30,active?'#f8e5aa':'#b1b9a5');textDraw(c,active?label:'＋'+label,x+w/2,y+20,10)}
textDraw(c,'🐾 園區大門',180,625,13);drawTree(c,16,537,.7);drawTree(c,343,538,.7);
// Staff in real-time customized uniforms; cleaner loops past bins and pathways
const keeperX=150,keeperY=228+(s.mode==='running'?Math.sin(t*.002)*16:0),guideX=190,guideY=444+(s.mode==='running'?Math.cos(t*.0018)*22:0),vendorX=35,vendorY=593;
for(const [role,x,y,variant] of [['keeper',keeperX,keeperY,0],['guide',guideX,guideY,1],['vendor',vendorX,vendorY,2]]){drawPerson(c,x,y,outfits[s.staff[role]]?.[1]||'#bd9b60',variant,s.staff[role]==='animal')}
if(s.cleanerHired){const y=98+(s.mode==='running'?((t*.038)%410):0);drawPerson(c,182,y,outfits[s.staff.cleaner]?.[1]||'#5c91af',3,s.staff.cleaner==='animal');textDraw(c,'🧹',190,y-7,12)}
if(s.mode==='running'&&speciesCount()){for(let i=0;i<Math.min(14,3+speciesCount());i++){const fraction=((t*.018+i*76)%490)/490,yy=528-fraction*475,offset=(i%4===0?-9:i%4===1?9:i%4===2?-2:3);drawPerson(c,180+offset,yy,['#b35d47','#d8b969','#7895b1','#c881a2'][i%4],i%3)}}
animation.food=animation.food.filter(f=>f.t<1.2);animation.food.forEach(f=>{const z=zones.find(z=>z.id===f.id);if(!z)return;const pp=f.t,x=180+(z.x+z.w/2-180)*pp,y=583+(z.y+33-583)*pp-65*Math.sin(Math.PI*pp);c.font='20px system-ui';c.fillText(f.emoji,x,y);f.t+=.025});
}
function frame(now){const dt=Math.min(50,Math.max(0,now-lastStamp));lastStamp=now;if(s.mode==='running'&&!document.hidden)animation.t+=dt;if(s.tab==='zoo'&&!document.hidden)buildScene(animation.t);requestAnimationFrame(frame)}
$('stage').addEventListener('click',e=>{const canvas=e.target.closest('#zcanvas');if(!canvas)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*360/r.width,y=(e.clientY-r.top)*650/r.height;for(const z of zonesForArea()){if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h){s.tab='build';s.buildFilter=s.animals[z.id]?'owned':animal(z.id).group;notify('🔨 找到'+animal(z.id).name+'棲地。');render(true);save();return}}if(y>=550){s.tab='build';render(true)}});

let last=Date.now();setInterval(()=>{const now=Date.now(),dt=Math.min(300,Math.max(0,now-last));last=now;if(document.hidden||s.mode!=='running')return;s.acc+=dt*s.speed;while(s.acc>=20000&&s.mode==='running'){s.acc-=20000;dailyStep();save()}},170);
document.addEventListener('visibilitychange',()=>{last=Date.now();if(document.hidden){if(s.mode==='running')s.mode='paused';stopMusic();save();updateHeader()}else if(s.music)startMusic()});window.addEventListener('pagehide',save);
render(true);$('intro').classList.add('hidden');showHome();requestAnimationFrame(frame);
// Browser-smoke-test helpers only enabled when ?test=1.
if(new URLSearchParams(location.search).has('test'))window.__pzTest={state:s,tick:dailyStep,close:closeDay,rerender:()=>render(false)};
})();
</script></body></html>
